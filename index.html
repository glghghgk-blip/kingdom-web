<link rel="stylesheet" href="fonts.css">
<style>
/* Layout: one-screen stack — header (stage + objective), pixel stage canvas, command panel. Single committed look: Qin lacquer black, bronze trim, cinnabar accents. */
:root{
  --ink:#13100d; --lacquer:#1d1813; --panel:#272019; --line:#4a3c2a;
  --bronze:#c09a55; --bronze-dim:#7d6338; --paper:#efe5cd; --muted:#a8997c;
  --cinnabar:#c43d2f; --jade:#55a07b; --sky:#5f93cc; --gold:#e0bb4e;
  --display:"Do Hyeon","Nanum Gothic","Apple SD Gothic Neo",sans-serif;
  --body:"Nanum Gothic","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --pixel:"Silkscreen","Courier New",monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--body);margin:0;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
#app{height:100%;max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
header{display:flex;flex-direction:column;gap:4px;border-bottom:1px solid var(--line);padding-bottom:8px}
.hrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.chip{font-family:var(--display);font-size:13px;padding:2px 8px;border:1px solid var(--bronze-dim);color:var(--bronze);letter-spacing:.05em}
.chip.battle{border-color:var(--cinnabar);color:#f0a093}
.chip.event{border-color:var(--jade);color:#9fd6b9}
#stageTitle{font-family:var(--display);font-size:22px;color:var(--paper);text-wrap:balance;flex:1;min-width:0}
#turn{font-family:var(--pixel);font-size:13px;color:var(--gold);font-variant-numeric:tabular-nums}
#objective{font-size:13px;color:var(--muted);min-height:1.2em}
#objective b{color:var(--gold);font-weight:700}
.iconbtn{background:transparent;border:1px solid var(--line);padding:4px 10px;font-size:13px;cursor:pointer;color:var(--muted)}
.iconbtn:hover,.iconbtn:focus-visible{border-color:var(--bronze);color:var(--paper);outline:none}
#stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;background:#0d0b09;border:1px solid var(--line)}
canvas#cv{display:block;cursor:pointer;touch-action:none}
#panel{min-height:132px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;border-top:1px solid var(--line);padding-top:8px}
@media (max-width:520px){#panel{grid-template-columns:minmax(0,1fr)}}
.card{display:flex;gap:10px;min-width:0;align-items:flex-start}
.card canvas{width:56px;height:56px;border:1px solid var(--bronze-dim);background:#2c241b;flex:none}
.card .info{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.card .nm{font-family:var(--display);font-size:18px}
.card .sub{font-size:12px;color:var(--muted)}
.bar{height:6px;background:#3a2f23;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--jade)}
.bar.enemy i{background:var(--cinnabar)}
.stats{font-family:var(--pixel);font-size:11px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.stats b{color:var(--paper);font-weight:400}
.cmds{display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;justify-content:flex-end;max-width:300px}
@media (max-width:520px){.cmds{justify-content:flex-start;max-width:none}}
.cmd{font-family:var(--display);font-size:16px;padding:7px 14px;background:var(--panel);border:1px solid var(--bronze-dim);cursor:pointer;min-width:72px}
.cmd:hover,.cmd:focus-visible{border-color:var(--bronze);background:#33291f;outline:none}
.cmd.primary{border-color:var(--cinnabar);background:#3a1d17}
.cmd:disabled{opacity:.35;cursor:default}
.hint{font-size:12px;color:var(--gold);margin-top:4px}
/* overlays */
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;background:rgba(13,11,9,.94);overflow:auto;padding:16px;gap:12px}
.overlay[hidden]{display:none!important}
.dialog{position:absolute;left:10px;right:10px;bottom:10px;display:block;min-height:108px;padding:12px 18px 16px 160px;cursor:pointer;
  background:linear-gradient(180deg,rgba(28,32,50,.95),rgba(14,16,28,.96));border:1px solid #b8955a;box-shadow:0 0 0 1px rgba(0,0,0,.65),inset 0 0 0 1px rgba(255,230,170,.08),0 8px 18px rgba(0,0,0,.45)}
.dialog[hidden],.scene[hidden],.toast[hidden]{display:none!important}
.dialog canvas{position:absolute;left:12px;bottom:12px;width:134px;height:134px;border:1px solid #b8955a;background:#1c1a22;box-shadow:0 6px 14px rgba(0,0,0,.55)}
.dialog .who{font-family:var(--display);font-size:20px;color:#f2d27c;letter-spacing:.04em;text-shadow:0 1px 0 #000}
.dialog .txt{font-size:15.5px;line-height:1.7;max-width:62ch;color:#f3ead6}
.dialog .more{position:absolute;right:12px;bottom:6px;font-family:var(--pixel);font-size:10px;color:#b8955a}
.dialog.narr{padding-left:18px;text-align:center}
.dialog.narr .txt{color:#d8cdb4;font-style:italic;margin:0 auto}
@media (max-width:560px){.dialog{padding-left:104px;min-height:96px}.dialog canvas{width:84px;height:84px}}
.scene{position:absolute;top:10px;left:10px;font-family:var(--display);font-size:14px;color:var(--bronze);background:rgba(19,16,13,.8);padding:3px 10px;border-left:3px solid var(--cinnabar)}
.title h1{font-family:var(--display);font-size:clamp(30px,7vw,48px);margin:8px 0 0;font-weight:400;letter-spacing:.02em}
.title .tag{color:var(--muted);font-size:13px}
.stlist{display:grid;gap:6px}
.st{display:grid;grid-template-columns:52px auto minmax(0,1fr);align-items:center;gap:10px;padding:8px 10px;background:var(--panel);border:1px solid var(--line);cursor:pointer;text-align:left}
.st:hover,.st:focus-visible{border-color:var(--bronze);outline:none}
.st .no{font-family:var(--pixel);font-size:12px;color:var(--bronze)}
.st .nm{font-size:14px;min-width:0}
.st.done .nm::after{content:" · 완료";color:var(--jade);font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.result h2{font-family:var(--display);font-size:40px;font-weight:400;margin:24px 0 4px;text-align:center}
.result p{text-align:center;color:var(--muted);margin:0}
.result .row{justify-content:center;margin-top:16px}
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.sheet .item{background:var(--panel);border:1px solid var(--line);padding:8px;display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:8px;align-items:center}
.sheet canvas{width:48px;height:48px;image-rendering:pixelated;background:#2c241b;border:1px solid var(--bronze-dim)}
.sheet label{font-size:12px;color:var(--muted);display:block;cursor:pointer}
.sheet label span{color:var(--bronze);text-decoration:underline}
.sheet input{display:none}
.gold{font-size:14px;color:var(--muted);align-self:center}
.gold b{color:var(--gold);font-family:var(--pixel);font-weight:400;font-variant-numeric:tabular-nums}
.camp-home{display:flex;flex-direction:column;gap:8px}
.acc-chip{display:inline-block;border:1px solid;padding:0 6px;margin:2px 2px 0 0;font-size:11px;color:var(--paper)}
.tbl{overflow-x:auto;border:1px solid var(--line)}
.tbl table{border-collapse:collapse;width:100%;font-size:13px;min-width:560px}
.tbl th,.tbl td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.tbl th{font-family:var(--display);font-weight:400;color:var(--bronze);background:var(--panel);position:sticky;top:0}
.tbl .num{text-align:right;font-family:var(--pixel);font-size:11px;font-variant-numeric:tabular-nums}
.tbl .eff{color:var(--muted)}
.tbl .act{white-space:nowrap;text-align:right}
.gdot{display:inline-block;width:8px;height:8px;margin-right:6px;vertical-align:middle}
.soon{font-size:10px;border:1px solid var(--bronze-dim);color:var(--bronze);padding:0 4px}
.iconbtn:disabled{opacity:.35;cursor:default}
.equip{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px}
.slots,.inv{display:grid;gap:6px;align-content:start}
.inv{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.slot{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);border-left-width:3px;background:var(--panel);padding:8px;min-width:0}
.slot>div{min-width:0}
.slot.empty{border-style:dashed;justify-content:center;min-height:52px}
.srow2{display:grid;grid-template-columns:42px minmax(0,1fr) 64px;align-items:center;gap:6px;font-size:12px}
.srow2 .sl{color:var(--muted)}
.srow2 b{font-family:var(--pixel);font-size:11px;font-weight:400;text-align:right;font-variant-numeric:tabular-nums}
.srow2 em{color:var(--jade);font-style:normal}
.sub-h{font-family:var(--display);font-weight:400;color:var(--bronze);margin:4px 0 0;font-size:18px}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
.rc{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px;background:var(--panel);border:1px solid var(--line);padding:10px}
.rc canvas{width:72px;height:72px;border:1px solid var(--bronze-dim);background:#2c241b}
.rinfo{min-width:0;display:flex;flex-direction:column;gap:6px}
.rinfo .nm{font-family:var(--display);font-size:18px}
.srows{display:grid;gap:3px}
.srow{display:grid;grid-template-columns:42px minmax(0,1fr) 28px 26px 26px;align-items:center;gap:4px;font-size:12px}
.srow .sl{color:var(--muted)}
.srow b{font-family:var(--pixel);font-size:11px;text-align:right;font-variant-numeric:tabular-nums;font-weight:400}
.srow .iconbtn{padding:0;height:22px;font-size:14px}
.srow .iconbtn:disabled{opacity:.3;cursor:default}
.sbar{height:6px;background:#3a2f23;position:relative}
.sbar i{position:absolute;inset:0 auto 0 0;background:var(--bronze)}
.pts{font-size:13px;color:var(--muted)}
.pts b{color:var(--gold)}
.sheet .forms{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.sheet .forms span{display:flex;flex-direction:column;align-items:center;gap:1px}
.sheet .forms canvas{width:40px;height:40px;image-rendering:auto}
.sheet .forms small{font-size:10px;color:var(--muted);white-space:nowrap}
.helpbody{font-size:14.5px;line-height:1.75;max-width:78ch}.helpbody p{margin:0 0 12px}.helpbody b{color:var(--gold);font-weight:700}
.talklog{max-height:46vh;overflow:auto;border:1px solid var(--line);padding:8px 12px;background:rgba(0,0,0,.25);font-size:14px;line-height:1.6}
.talklog p{margin:0 0 4px}.talklog b{color:var(--gold);font-weight:400;font-family:var(--display)}
.grade{font-family:var(--display);font-size:56px;text-align:center;line-height:1;margin:4px 0}
.grade.gS{color:var(--gold);text-shadow:0 0 18px rgba(224,187,78,.5)}.grade.gA{color:#9fd6b9}.grade.gB{color:var(--muted)}
.gbadge{font-family:var(--display);font-size:12px;border:1px solid;padding:0 4px;margin-left:4px}.gbadge.gS{color:var(--gold)}.gbadge.gA{color:#9fd6b9}.gbadge.gB{color:var(--muted)}
.chgrp{border:1px solid var(--line);background:rgba(39,32,25,.5);padding:6px 10px}
.chgrp summary{cursor:pointer;font-family:var(--display);font-size:17px;color:var(--bronze);padding:4px 0}
.chgrp[open] summary{margin-bottom:6px}
.stars{color:var(--gold);font-size:11px;letter-spacing:-1px}
.rc.off{opacity:.5}
.toast{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(19,16,13,.92);border:1px solid var(--gold);color:var(--gold);font-family:var(--display);font-size:18px;padding:6px 18px;pointer-events:none;white-space:nowrap}
/* ===== 가로 모드: 왼쪽 전장, 오른쪽 정보·명령 패널 ===== */
@media (orientation:landscape){
  #app{max-width:none;display:grid;grid-template-columns:minmax(0,1fr) clamp(220px,25vw,320px);grid-template-rows:auto minmax(0,1fr);gap:6px 10px;padding-block:6px}
  header{grid-column:1/3;flex-direction:row;align-items:center;flex-wrap:wrap;gap:4px 14px;padding-bottom:5px}
  header .hrow{flex:1 1 auto;min-width:0}
  #objective{flex:1 1 320px;min-width:0}
  #stage{grid-column:1;grid-row:2}
  #panel{grid-column:2;grid-row:2;grid-template-columns:minmax(0,1fr);align-content:start;border-top:0;border-left:1px solid var(--line);padding:0 0 0 10px;overflow-y:auto;min-height:0}
  .card{flex-direction:column}
  .card canvas{width:64px;height:64px}
  .cmds{display:grid;grid-template-columns:1fr 1fr;max-width:none;justify-content:stretch}
  .cmd{min-width:0;padding:8px 6px}
}
@media (orientation:landscape) and (max-height:520px){
  #app{padding-block:4px;gap:4px 8px}
  #stageTitle{font-size:17px}
  .chip{font-size:11px;padding:1px 6px}
  #objective{font-size:12px}
  .card .nm{font-size:16px}
  .cmd{font-size:14px;padding:6px 4px}
  .dialog{min-height:76px;padding:8px 12px 12px 96px}
  .dialog canvas{width:76px;height:76px;left:8px;bottom:8px}
  .dialog .who{font-size:16px}
  .dialog .txt{font-size:13.5px;line-height:1.55}
}
/* 세로로 든 휴대폰: 가로로 돌려 달라는 안내 */
#rotate{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;
  background:var(--ink);padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
#rotate .ph{width:56px;height:92px;border:3px solid var(--bronze);border-radius:10px;position:relative;animation:turn 2.4s ease-in-out infinite}
#rotate .ph::after{content:"";position:absolute;left:50%;bottom:6px;width:10px;height:3px;margin-left:-5px;background:var(--bronze);border-radius:2px}
@keyframes turn{0%,20%{transform:rotate(0)}50%,80%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
#rotate h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0;color:var(--paper)}
#rotate p{margin:0;color:var(--muted);font-size:14px;max-width:30ch}
@media (orientation:portrait) and (max-width:820px){ body:not(.keep-portrait) #rotate{display:flex} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="rotate" role="dialog" aria-label="화면 방향 안내">
  <div class="ph" aria-hidden="true"></div>
  <h2>가로로 돌려 주세요</h2>
  <p>킹덤 천하대장군전은 가로 화면에 맞춰 만들었습니다.</p>
  <button class="cmd primary" id="goLand" type="button">전체 화면 가로로 보기</button>
  <button class="iconbtn" id="stayPortrait" type="button">세로로 계속하기</button>
</div>
<div id="app">
  <header>
    <div class="hrow">
      <span class="chip" id="typeChip">타이틀</span>
      <span id="stageTitle">킹덤 천하대장군전</span>
      <span id="turn"></span>
      <button class="iconbtn" id="setBtn" type="button">설정</button>
      <button class="iconbtn" id="menuBtn" type="button">메뉴</button>
    </div>
    <div id="objective">서장 · 왕도 탈환 전초전 프로토타입</div>
  </header>
  <div id="stage">
    <canvas id="cv" width="768" height="640" aria-label="전장"></canvas>
    <div class="overlay title" id="titleScr"></div>
    <div class="overlay" id="sheetScr" hidden></div>
    <div class="overlay result" id="resultScr" hidden></div>
    <div class="overlay" id="setScr" hidden style="z-index:5"></div>
    <div class="dialog" id="dlg" hidden>
      <canvas id="dlgFace" width="160" height="160"></canvas>
      <div style="min-width:0;flex:1;display:flex;flex-direction:column;gap:2px">
        <div class="who" id="dlgWho"></div>
        <div class="txt" id="dlgTxt"></div>
      </div>
      <div class="more">TAP ▶</div>
    </div>
    <div class="scene" id="sceneTag" hidden></div>
    <div class="toast" id="toast" hidden></div>
  </div>
  <div id="panel">
    <div class="card" id="card"></div>
    <div class="cmds" id="cmds"></div>
  </div>
</div>

<script>
"use strict";
/* ================= constants ================= */
const T = 16, S = 4, PX = T * S;
let COLS = 12, ROWS = 10; // 스테이지마다 맵 크기로 바뀜
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const $ = id => document.getElementById(id);
const SET = (() => { try { return Object.assign({ speed: 1, autoTalk: false }, JSON.parse(localStorage.getItem('kd-set') || '{}')); } catch (e) { return { speed: 1, autoTalk: false }; } })();
function saveSet() { try { localStorage.setItem('kd-set', JSON.stringify(SET)); } catch (e) {} }
const sleep = ms => new Promise(r => setTimeout(r, ms * SET.speed));
const TALKLOG = [];

const TILE = {
  '.': { n: '평지', cost: 1, def: 0 },
  'f': { n: '숲', cost: 2, def: .2 },
  'r': { n: '길', cost: 1, def: 0 },
  'w': { n: '물', block: 1 },
  'h': { n: '가옥', block: 1 },
  'm': { n: '바위산', block: 1 },
  'b': { n: '다리', cost: 1, def: 0 },
  's': { n: '언덕', cost: 2, def: .1 },
  'd': { n: '폐허', cost: 1, def: .15 },
  'W': { n: '성벽', block: 1 },
  'g': { n: '성문', cost: 1, def: .1 },
  'p': { n: '석판', cost: 1, def: 0 },
  'o': { n: '여울', cost: 2, def: -.1 },
  'V': { n: '성벽 위', cost: 1, def: .25, eblock: 1 },
  'e': { n: '쪽문', cost: 1, def: .1, eblock: 1 },
  'x': { n: '망루', cost: 1, def: .2 },
  'T': { n: '옥좌', cost: 1, def: .2 },
  'I': { n: '기둥', block: 1 },
  'v': { n: '군막', block: 1 },
  'k': { n: '궁전 바닥', cost: 1, def: 0 },
};
const MAP_STYLE = { village: 'thatch', kokuhi: 'thatch' }; // 초가 마을 / 기본은 기와

/* ================= pixel art (placeholder sprites, original designs) ================= */
const BASE = [
  "................",
  "......KKKK......",
  ".....KHHHHK.....",
  "....KHHHHHHK....",
  "....KHSSSSHK....",
  "....KSESSESK....",
  "....KSSSSSSK....",
  ".....KSSSSK.....",
  "....KAAAAAAK....",
  "...KSADDDDASK...",
  "...KSAAAAAASK...",
  "....KADDDDAK....",
  "....KPPKKPPK....",
  "....KPPK.KPPK...",
  "....KKK...KKK...",
  "................"];
function spritePattern(look) {
  let g = BASE.map(r => r.padEnd(16, '.').split(''));
  if (look.robe) { // long robe to the ground
    g[12] = "....KAAAAAAK....".split(''); g[13] = "...KAAAAAAAAK...".split(''); g[14] = "...KKKKKKKKKK...".split('');
  }
  if (look.hood) { // cloth hood over the head
    g[1] = ".....KKKKKK.....".split(''); g[2] = "....KAAAAAAK....".split(''); g[3] = "...KAAAAAAAAK...".split('');
    g[4] = "...KAKSSSSKAK...".split('');
  }
  if (look.topknot) { g[0] = ".......KK.......".split(''); g[1] = "......KHHK......".split(''); }
  const put = (x, y, c) => { if (g[y]) g[y][x] = c; };
  if (look.weapon === 'sword') { for (let y = 5; y <= 10; y++) put(13, y, 'W'); put(12, 10, 'K'); put(14, 10, 'K'); put(13, 11, 'K'); }
  if (look.weapon === 'spear') { for (let y = 2; y <= 13; y++) put(13, y, 'G'); put(13, 1, 'W'); put(13, 0, 'W'); }
  if (look.weapon === 'dagger') { put(13, 9, 'W'); put(13, 10, 'W'); put(13, 11, 'K'); }
  if (look.weapon === 'tube') { for (let x = 11; x <= 15; x++) put(x, 8, 'G'); }

/* ================= save ================= */
const SAVE_KEY = 'kd-save';
function freshSave() { return { done: {}, roster: {}, gold: 300, inv: {}, equip: {}, flags: {}, dead: {}, left: {}, met: {}, sp: {}, skills: {}, eqSkills: {}, titles: {}, eqTitles: {}, bond: {}, stats: {}, cls: {}, merit: {}, cons: { potion: 2 }, best: {} }; }
let save = freshSave();
try { const s = localStorage.getItem(SAVE_KEY); if (s) save = Object.assign(freshSave(), JSON.parse(s)); } catch (e) {}
function normSave() { const f = freshSave(); for (const k in f) if (save[k] == null) save[k] = f[k]; }
normSave();
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }
// 저장 슬롯: 수동 3칸 + 자동 1칸
function slotKey(n) { return n === 'auto' ? 'kd-auto' : 'kd-slot-' + n; }
function readSlot(n) { try { const s = localStorage.getItem(slotKey(n)); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
function progressLabel() {
  const i = firstOpenIdx(); const st = STAGES[i < 0 ? STAGES.length - 1 : i];
  return `${i < 0 ? '모든 장 완료' : (st.type === 'battle' ? st.no + ' ' : '') + st.title} · 신 LV ${(save.roster.shin || { lv: 1 }).lv}`;
}
function writeSlot(n) { try { localStorage.setItem(slotKey(n), JSON.stringify({ t: Date.now(), label: progressLabel(), data: save })); return true; } catch (e) { return false; } }
function autosave() { writeSlot('auto'); }
function loadSlot(n) { const d = readSlot(n); if (!d) return false; save = Object.assign(freshSave(), d.data); normSave(); persist(); return true; }

/* ================= 진행·멤버 ================= */
function firstOpenIdx() { let last = -1; STAGES.forEach((s, i) => { if (save.done[s.id] && !s.pov) last = i; }); return STAGES.findIndex((s, i) => !save.done[s.id] && !(s.pov && i < last) && !(s.hidden && !hiddenOpen())); }
function chOf(st) { return st && st.ch != null ? st.ch : 0; }
function progressIdx() { const i = firstOpenIdx(); return i < 0 ? STAGES.length - 1 : i; }
function progressCh() { return chOf(STAGES[progressIdx()]); }
function members() { return Object.keys(save.roster).filter(k => CHARS[k] && !CHARS[k].obj && !save.dead[k] && !save.left[k] && Array.isArray(save.roster[k].st)); }

/* ================= 일기토 ================= */
['houken', 'rinko', 'renpa', 'saji', 'maki', 'fuuki', 'choga', 'keisha', 'shukyo', 'muta', 'bajio', 'kal_vice', 'hogaku', 'juteki', 'maenggyu', 'baekgwang', 'josub', 'rankai', 'seokha', 'yeochung', 'kaimou']
  .forEach(k => { if (CHARS[k]) CHARS[k].duel = 1; });
const DUEL_ACT = { atk: '공격', def: '방어', spc: '필살' };
const DUEL_BEAT = { atk: 'spc', spc: 'def', def: 'atk' };
function canDuel(s, t) { return t && t.team === 'enemy' && alive(t) && CHARS[t.key].duel && !G.duels.has(t.uid) && dist(s, t) === 1 && stOf(s, 0) >= 50 && !s.noAttack && !s.obj; }
function duelPick(b, last) {
  const r = rand(), spcBias = b.fx.undying || b.rage ? .45 : .33;
  if (last && r < .3) return Object.keys(DUEL_BEAT).find(k => DUEL_BEAT[k] === last); // 상대가 방금 낸 수를 이기는 수를 노림
  return r < spcBias ? 'spc' : r < spcBias + (1 - spcBias) / 2 ? 'atk' : 'def';
}
function duelDmg(x, y) { return Math.max(3, Math.round((stOf(x, 0) - stOf(y, 0) * .4) / 3 + 4)); }
async function startDuel(s, t) {
  busy = true; G.overlay = null; G.duels.add(t.uid); cmds([]);
  const d = $('dlg'), txt = $('dlgTxt'); d.classList.add('narr'); $('dlgFace').hidden = true; $('dlgWho').textContent = ''; d.onclick = null;
  SFX.play('alarm'); toast(`일기토! ${s.name} vs ${t.name}`, 1600);
  SFX.bgm('duel'); await duelSplash(s, t);
  await say(s.key, `${t.name}! 나와 일대일로 붙어라!`, 1); await say(t.key, '…좋다. 받아 주지.');
  let last = null, sWin = 0;
  for (let round = 1; round <= 3; round++) {
    if (!alive(s) || !alive(t) || (t.fx.undying && t.hp <= Math.ceil(t.mhp * t.fx.undying))) break;
    const ep = duelPick(t, last), tell = rand() < .6 ? ep : ['atk', 'def', 'spc'][Math.floor(rand() * 3)];
    const hint = { atk: `${t.name}이(가) 칼끝을 곧게 겨눈다…`, def: `${t.name}이(가) 몸을 낮추고 자세를 굳힌다…`, spc: `${t.name}이(가) 크게 숨을 들이쉰다…` }[tell];
    d.hidden = false; txt.innerHTML = `<b style="color:var(--gold)">일기토 ${round}합</b> — ${s.name} HP ${s.hp}/${s.mhp} · ${t.name} HP ${t.hp}/${t.mhp}<br>${hint}<br><span class="tag">공격은 필살을, 필살은 방어를, 방어는 공격을 이긴다</span>`;
    const me = await new Promise(res => { cmds(Object.entries(DUEL_ACT).map(([k, n]) => ({ t: n, primary: k === 'atk', f: () => res(k) }))); if (window.__autoChoice != null) res(['atk', 'def', 'spc'][Math.floor(Math.random() * 3)]); });
    cmds([]); last = me;
    const ds = duelDmg(s, t), dt = duelDmg(t, s);
    let toT = 0, toS = 0, line;
    if (me === ep) { toT = me === 'def' ? 0 : Math.round(ds * .5); toS = me === 'def' ? 0 : Math.round(dt * .5); line = `둘 다 ${DUEL_ACT[me]}! 칼날이 맞부딪쳤다.`; }
    else if (DUEL_BEAT[me] === ep) { toT = me === 'spc' ? Math.round(ds * 1.8) : me === 'def' ? Math.round(ds * .8) : ds; line = `${s.name}의 ${DUEL_ACT[me]}이(가) ${t.name}의 ${DUEL_ACT[ep]}을(를) 꺾었다!`; sWin++; }
    else { toS = ep === 'spc' ? Math.round(dt * 1.8) : ep === 'def' ? Math.round(dt * .8) : dt; line = `${t.name}의 ${DUEL_ACT[ep]}에 ${s.name}의 ${DUEL_ACT[me]}이(가) 밀렸다…`; }
    const fT = t.fx.undying ? Math.ceil(t.mhp * t.fx.undying) : 0;
    if (toT) { t.hp = Math.max(fT, t.hp - toT); floatText(t, '-' + toT, '#ff8a7a'); t.hitShake = 1; setTimeout(() => t.hitShake = 0, 250); SFX.play(toT > ds ? 'crit' : 'hit'); }
    if (toS) { s.hp = Math.max(0, s.hp - toS); floatText(s, '-' + toS, '#ff8a7a'); s.hitShake = 1; setTimeout(() => s.hitShake = 0, 250); SFX.play('hit'); }
    if (!toT && !toS) SFX.play('miss');
    txt.innerHTML = `<b style="color:var(--gold)">일기토 ${round}합</b> — ${s.name} ${DUEL_ACT[me]} / ${t.name} ${DUEL_ACT[ep]}<br>${line}`;
    await sleep(window.__autoChoice != null ? 0 : 1100);
  }
  d.hidden = true; d.classList.remove('narr'); SFX.bgm(stageBgm(G.stage));
  if (t.hp <= 0) { onKill(s, t); save.stats[s.key] = save.stats[s.key] || {}; save.stats[s.key].duels = (save.stats[s.key].duels || 0) + 1; toast(`일기토 승리! ${t.name} 격파`, 1800); }
  else if (sWin >= 2) { save.stats[s.key] = save.stats[s.key] || {}; save.stats[s.key].duels = (save.stats[s.key].duels || 0) + 1; toast('일기토 우세승!', 1500); addBuff(s, { n: '일기토 승리', atk: .15, t: 3 }); }
  else if (s.hp <= 0) { onKill(t, s); toast(`${s.name}이(가) 일기토에서 쓰러졌다…`, 1800); }
  gainExp(s, 30);
  await onDeaths(); busy = false; G.dangerCache = null;
  if (await checkEnd()) return;
  if (alive(s)) endAction(s); else autoEnd();
}

function sortieScreen(idx, party, stObj) {
  return new Promise(res => {
    const st = stObj || STAGES[idx], s = $('sheetScr'); s.hidden = false;
    const fixed = st.fixed || ['shin'];
    let pick = st.pick ? party.filter(k => fixed.includes(k)) : party.slice();
    const guests = (st.units || []).filter(u => u.team === 'guest').map(u => u.key);
    const draw = () => {
      const chosen = st.pick ? pick : party;
      const ctx = { st, present: new Set([...chosen, ...guests]), allies: new Set(chosen), units: chosen.map(k => ({ key: k, team: 'ally', rank: rosterOf(k).rank })) };
      const need = st.pick ? st.pick + fixed.filter(k => party.includes(k)).length : 0;
      s.innerHTML = `<div class="row" style="justify-content:space-between;align-items:center"><div class="title"><h1 style="font-size:26px">${st.no} ${st.title} ${st.stars ? `<span class="stars">${'★'.repeat(st.stars)}</span>` : ''}</h1>
        <div class="tag"><b style="color:var(--gold)">승리</b> ${st.win.text} · <b style="color:#f0a093">패배</b> ${st.lose.text}</div>
        ${guests.length ? `<div class="tag">AI 아군: ${[...new Set(guests)].map(k => CHARS[k].name).join(', ')}</div>` : ''}</div>
        <div class="row"><button class="cmd primary" id="goDeploy" type="button" ${st.pick && pick.length !== need ? 'disabled' : ''}>배치로</button><button class="cmd" id="sortBack" type="button">거점</button></div></div>
        ${st.pick ? `<p class="tag" style="color:var(--gold)">신 외에 ${st.pick}명을 고르세요. (${pick.length - fixed.filter(k => party.includes(k)).length}/${st.pick})</p>` : ''}
        <div class="roster">${party.map(k => { const r = rosterOf(k), on = chosen.includes(k), lock = fixed.includes(k);
          const ts = eqTitles(k).map(id => `<span class="acc-chip" style="border-color:${titleActive(TITLES[id], k, ctx) ? 'var(--gold)' : 'var(--line)'};color:${titleActive(TITLES[id], k, ctx) ? 'var(--gold)' : 'var(--muted)'}">${TITLES[id].n}</span>`).join('');
          return `<div class="rc${st.pick && !on ? ' off' : ''}"><canvas width="160" height="160" data-face="${k}"></canvas><div class="rinfo"><div class="nm">${CHARS[k].name} <span class="sub">${r.rank} · LV ${r.lv}</span></div>
          <div class="tag">스킬 ${eqSkills(k).map(id => SKILLS[id].n).join(', ') || '없음'}</div><div>${ts || '<span class="tag">칭호 없음</span>'}</div>
          ${st.pick && !lock ? `<button class="iconbtn" data-pick="${k}" type="button">${on ? '빼기' : '넣기'}</button>` : ''}</div></div>`; }).join('')}</div>
        <h3 class="sub-h">진형</h3><div class="row">${Object.entries(FORMATIONS).map(([id, F]) => { const ok = formOK(id, chosen, chOf(st)); return `<button class="cmd${(save.form || 'none') === id ? ' primary' : ''}" data-form="${id}" type="button" ${ok ? '' : 'disabled'} title="${F.d}">${F.n}</button>`; }).join('')}</div>
        <p class="tag">${FORMATIONS[save.form || 'none'].n}: ${FORMATIONS[save.form || 'none'].d}${(STAGE_WEATHER[st.id] || st.weather) ? ` · 날씨 ${WEATHER[st.weather || STAGE_WEATHER[st.id]].n}: ${WEATHER[st.weather || STAGE_WEATHER[st.id]].d}` : ''}</p>
        <p class="tag">금색 칭호는 이 편성에서 조건이 켜집니다. 위기·단독 칭호는 전투 중 조건이 맞을 때 켜집니다.</p>`;
      s.querySelectorAll('[data-face]').forEach(c => drawPortrait(c, c.dataset.face));
      s.querySelectorAll('[data-form]').forEach(b => b.onclick = () => { save.form = b.dataset.form; persist(); draw(); });
      s.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => { const k = b.dataset.pick; if (pick.includes(k)) pick = pick.filter(x => x !== k); else if (pick.length < need) pick.push(k); draw(); });

function SBld(map) {
  const M = MAPS[map], W = M[0].length, H = M.length, used = new Set();
  const pass = (x, y) => x >= 0 && y >= 0 && x < W && y < H && TILE[M[y][x]] && !TILE[M[y][x]].block && !TILE[M[y][x]].eblock;
  const hs = (x, y, s) => (((x + 11) * 73856093) ^ ((y + 7) * 19349663) ^ (s * 83492791)) >>> 0;

  const count = r => { let n = 0; for (let y = r[1]; y <= r[3]; y++) for (let x = r[0]; x <= r[2]; x++) if (free(x, y)) n++; return n; };
  const reg = (side, d0, d1, l0, l1) => { const X = v => Math.round(v * (W - 1)), Y = v => Math.round(v * (H - 1));
    if (side === 'W') return [X(d0), Y(l0), X(d1), Y(l1)]; if (side === 'E') return [X(1 - d1), Y(l0), X(1 - d0), Y(l1)];

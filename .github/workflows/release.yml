name: APK 릴리스 올리기
on:
  push:
    branches: [apk]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: APK 합치기
        run: cat parts/part_* > kingdom-tiandaejanggun.apk && ls -l kingdom-tiandaejanggun.apk
      - name: 릴리스 만들기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(cat VERSION)
          gh release delete "$V" -y --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create "$V" kingdom-tiandaejanggun.apk -R "$GITHUB_REPOSITORY" --target apk --latest \
            -t "킹덤 천하대장군전 $V" \
            -n "안드로이드용 설치 파일입니다. 아래 kingdom-tiandaejanggun.apk를 받아 설치하세요. (설치할 때 '출처를 알 수 없는 앱' 허용이 필요합니다)

          웹에서 바로 하기: https://glghghgk-blip.github.io/kingdom-web/"
